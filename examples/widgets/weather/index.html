<!doctype html><html><head><meta charset="utf-8"><style>
:root{--fg:#111;color-scheme:light dark}body{margin:0;font:14px system-ui,sans-serif;color:var(--fg)}
#row{display:flex;align-items:center;gap:10px}#ic{font-size:34px;line-height:1}#big{font-size:34px;font-weight:700}#sub{opacity:.7}details{font-size:12px;opacity:.8;margin-top:6px}
input,button{font:inherit;width:6.5em;margin:4px 4px 0 0;padding:3px 6px;border-radius:6px;border:1px solid #8886;background:transparent;color:inherit}button{width:auto}
</style></head><body><div id="row"><span id="ic" aria-hidden="true"></span><div id="big">…</div></div><div id="sub">Loading weather</div>
<details><summary>Location</summary><input id="lat" placeholder="lat"><input id="lon" placeholder="lon"><button id="go">Save</button></details>
<script src="app.js"></script></body></html>
